<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Kushagra Singh - ServiceNow Developer, learning AI">
  <title>Kushagra Singh - ServiceNow Developer, learning AI</title>
  <defs>
    <!-- faint grid drawn behind everything -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FCEE0A" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <!-- thin horizontal lines, like an old monitor -->
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" fill-opacity="0.35"/>
    </pattern>
    <style>
      .title { font-family: "Arial Black", "Segoe UI Black", Impact, "Helvetica Neue", Arial, sans-serif; font-weight: 900; font-size: 96px; }
      .mono  { font-family: Consolas, "SFMono-Regular", Menlo, "Courier New", monospace; }
      /* the cyan and magenta copies of the name jump sideways now and then: the "glitch" */
      .cy { animation: gc 4s steps(1) infinite; }
      .mg { animation: gm 4s steps(1) infinite; }
      @keyframes gc { 0%,100% { transform: translate(-4px,0); } 46% { transform: translate(-14px,2px); } 48% { transform: translate(6px,-2px); } 50% { transform: translate(-4px,0); } 84% { transform: translate(-10px,0); } 86% { transform: translate(-4px,0); } }
      @keyframes gm { 0%,100% { transform: translate(4px,0); } 46% { transform: translate(12px,-2px); } 48% { transform: translate(-8px,2px); } 50% { transform: translate(4px,0); } 84% { transform: translate(10px,0); } 86% { transform: translate(4px,0); } }
      .slice { animation: sl 4s steps(1) infinite; opacity: 0; }
      @keyframes sl { 0%,45%,51%,100% { opacity: 0; } 46% { opacity: 1; transform: translate(-18px,0); } 48% { opacity: 1; transform: translate(14px,0); } }
      .blink { animation: bl 1.2s steps(1) infinite; }
      @keyframes bl { 50% { opacity: 0; } }
    </style>
  </defs>

  <!-- background -->
  <rect width="1200" height="320" fill="#0B0B10"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- frame with cut corners -->
  <path d="M30 20H1140L1180 60V300H60L20 260V20Z" fill="none" stroke="#FCEE0A" stroke-width="2"/>
  <path d="M1150 20H1180V50" fill="none" stroke="#00F0FF" stroke-width="3"/>
  <path d="M20 270V300H50" fill="none" stroke="#FF2A6D" stroke-width="3"/>

  <!-- small status text -->
  <text x="60" y="62" class="mono" font-size="16" fill="#00F0FF" letter-spacing="3">// PROFILE.SYS</text>
  <rect x="222" y="49" width="10" height="16" fill="#00F0FF" class="blink"/>
  <text x="1120" y="62" class="mono" font-size="16" fill="#FF2A6D" letter-spacing="3" text-anchor="end">STATUS: ONLINE</text>

  <!-- the name: magenta + cyan copies underneath, yellow on top -->
  <text x="600" y="170" text-anchor="middle" textLength="980" lengthAdjust="spacingAndGlyphs" class="title mg" fill="#FF2A6D">KUSHAGRA SINGH</text>
  <text x="600" y="170" text-anchor="middle" textLength="980" lengthAdjust="spacingAndGlyphs" class="title cy" fill="#00F0FF">KUSHAGRA SINGH</text>
  <text x="600" y="170" text-anchor="middle" textLength="980" lengthAdjust="spacingAndGlyphs" class="title" fill="#FCEE0A">KUSHAGRA SINGH</text>
  <!-- thin bars that flash across the name during a glitch -->
  <rect class="slice" x="110" y="118" width="980" height="6" fill="#00F0FF"/>
  <rect class="slice" x="110" y="146" width="980" height="4" fill="#FF2A6D"/>

  <!-- yellow tag line with a cut corner -->
  <path d="M250 200H950V226L930 246H250Z" fill="#FCEE0A"/>
  <text x="600" y="231" text-anchor="middle" class="mono" font-size="22" font-weight="700" fill="#0B0B10" letter-spacing="4">SERVICENOW DEVELOPER  //  LEARNING AI</text>

  <!-- decorative bars -->
  <g fill="#FCEE0A">
    <rect x="60" y="272" width="4" height="14"/><rect x="68" y="272" width="2" height="14"/><rect x="74" y="272" width="6" height="14"/>
    <rect x="84" y="272" width="2" height="14"/><rect x="90" y="272" width="4" height="14"/><rect x="98" y="272" width="2" height="14"/>
    <rect x="104" y="272" width="8" height="14"/><rect x="116" y="272" width="2" height="14"/><rect x="122" y="272" width="4" height="14"/>
  </g>
  <rect x="1000" y="278" width="140" height="3" fill="#00F0FF"/>
  <rect x="1060" y="286" width="80" height="3" fill="#FF2A6D"/>

  <!-- monitor lines over everything -->
  <rect width="1200" height="320" fill="url(#scan)" opacity="0.5"/>
</svg>
